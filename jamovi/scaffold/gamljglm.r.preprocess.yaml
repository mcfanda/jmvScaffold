---
name:  gamljglm
title: Generalized Linear Model
jrs: '1.0'
items:
  - name: model
    type: Property
    description: The underlying estimated model

  - name: main
    type: Group
    title: Model Results
    items:
           - name: r2
             title: Model Fit
             type: Table
             description: a table of R
             clearWith:
                   -  type: scaffold
                      name: modeloptions
                      file: options.yaml
                   -  type: scaffold
                      name: nestedoptions
                      file: options.yaml

             rows: 1
             columns:
                    - name: model
                      title: Model
                      visible: (comparison)
                    - name: r2
                      title: R²
                      type: number
                    - name: ar2
                      title: Adj. R²
                      type: number
                    - name:  df1
                      title: df
                      type: integer
                    - name: test
                      title: X²
                      type: number
                    - name: p
                      title: p
                      type: number
                      format: zto,pvalue
             refs: goodness
                      
           - name: fit
             title: Additional indices
             type: Table
             visible: true
             clearWith:
                   -  type: scaffold
                      name: modeloptions
                      file: options.yaml

             columns:
                    - name: info
                      type: text
                      title: "Info"
                    - name: value
                      type: text
                      title: "Model Value"


  - name: posthoc
    title: Post Hoc Tests
    type: Array
    description: an array of post-hoc tables
    items: (posthoc)
    clearWith:
        - posthoc
    template:
        title:  ""
        type: Table
        clearWith:
                   -  type: scaffold
                      name: modeloptions
                      file: options.yaml
        columns:
        - name: response
          title: Response 
          type: text


  - name: simpleEffects
    title: Simple Effects
    type: Group
    items:
            - name: anova
              type: scaffold
              file: results.yaml

            - name: coefficients
              title: Parameter Estimates for simple effects of ___key___
              type: Table
              visible: false
              clearWith:
                   -  type: scaffold
                      name: modeloptions
                      file: options.yaml
              columns:
                     - name: response
                       title: Response 
                       type: text


  - name: simpleInteractions
    title: Simple Interactions 
    type: Array
    description: an array of simple interactions tables
    visible: false
    clearWith:
                   -  type: scaffold
                      name: modeloptions
                      file: options.yaml

    template:
        title:  "Interaction: ___key___"
        type: Group
        clearWith: []
        items:
           - type: Table
             name: anova
             title: ANOVA test -  $key
             columns:
                   - name: effect
                     title: 'Effect'
                     type: text

           - type: scaffold
             name: anova2
             file: results.yaml



